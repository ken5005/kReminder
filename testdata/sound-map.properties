# kReminder sound-map.properties
# 書式: 1行1件で「音声名」の次に等号、その次に拡張子アリのファイル名を書く。
# # より後ろは行内のどこにあってもコメント扱い（音声名・ファイル名に # は使えない）。
# ここに書いたファイルは、以後この音声名でのみ SND.play() から呼べる
# （元のファイル名(stem)では呼べなくなる）。
# 書かなかったファイルは今まで通りファイル名（拡張子抜き）で呼べる。
